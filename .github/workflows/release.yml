name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Native headsetcontrol.dll
        shell: cmd
        run: |
          call build_native.bat

      - name: Build Applications
        shell: cmd
        run: |
          call build.bat

      - name: Compile Inno Setup Installer
        run: ISCC.exe installer.iss

      - name: Create Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path HeadsetControlTaskbarBatteryIndicator.exe, HeadsetControlTaskbarBatteryIndicatorDebug.exe, headsetcontrol.dll -DestinationPath Output\HeadsetControlTaskbarBatteryIndicatorPortable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/HeadsetControlTaskbarBatteryIndicatorSetup.exe
            Output/HeadsetControlTaskbarBatteryIndicatorPortable.zip
            HeadsetControlTaskbarBatteryIndicator.exe
            HeadsetControlTaskbarBatteryIndicatorDebug.exe
          draft: false
          generate_release_notes: true
