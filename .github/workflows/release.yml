name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # needed for SDK style build

      - name: Build Application
        run: dotnet build HeadsetControlTaskbarBatteryIndicator.csproj -c Release

      - name: Download HeadsetControl
        shell: pwsh
        run: |
          $releaseUrl = "https://api.github.com/repos/Sapd/HeadsetControl/releases/latest"
          $releaseData = Invoke-RestMethod -Uri $releaseUrl
          $asset = $releaseData.assets | Where-Object { $_.name -like "*-Windows.zip" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "headsetcontrol.zip"
          Expand-Archive -Path "headsetcontrol.zip" -DestinationPath "hc_temp"
          Get-ChildItem -Path "hc_temp" -Recurse -Filter "headsetcontrol.exe" | Copy-Item -Destination "."
          Get-ChildItem -Path "hc_temp" -Recurse -Filter "libhidapi-0.dll" | Copy-Item -Destination "."
          Remove-Item -Recurse -Force "hc_temp", "headsetcontrol.zip"

      - name: Compile Inno Setup Installer
        run: ISCC.exe installer.iss
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/HeadsetBatteryIndicatorSetup.exe
          draft: false
          generate_release_notes: true
